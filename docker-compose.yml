# Local PostgreSQL for development: `docker compose up -d db`
# Full stack (app + db): `docker compose up --build`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nodera
      POSTGRES_PASSWORD: nodera
      POSTGRES_DB: nodera
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodera"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://nodera:nodera@db:5432/nodera?schema=public
      UPLOAD_DIR: /data/uploads
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["3000:3000"]
    volumes: [uploads:/data/uploads]
    profiles: [full]
volumes:
  pgdata:
  uploads:
